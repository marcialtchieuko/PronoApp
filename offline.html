<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2F80ED" />
<title>PronoApp</title>
<style>
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#EEF1F5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box { background:#fff; border-radius:20px; padding:32px 24px; text-align:center; max-width:320px; margin:16px; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
  img { width:72px; height:72px; border-radius:16px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 8px; color:#171A1F; font-weight:800; }
  p { font-size:14px; color:#838B96; margin:0 0 20px; line-height:1.5; }
  button { background:linear-gradient(180deg,#FBC15E,#F5A623); border:none; color:#2B1B02; font-weight:700; font-size:14px; padding:12px 24px; border-radius:12px; cursor:pointer; width:100%; }
</style>
</head>
<body>
  <div class="box">
    <img src="/icon-192.png" alt="PronoApp" />
    <h1 id="t">Vous êtes hors connexion</h1>
    <p id="p">Impossible de joindre le serveur. Vérifiez votre connexion internet, puis réessayez.</p>
    <button id="b" onclick="location.reload()">Réessayer</button>
  </div>
  <script>
    if ((navigator.language || "").toLowerCase().indexOf("fr") !== 0) {
      document.documentElement.lang = "en";
      document.getElementById("t").textContent = "You are offline";
      document.getElementById("p").textContent = "Unable to reach the server. Check your internet connection and try again.";
      document.getElementById("b").textContent = "Try again";
    }
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
